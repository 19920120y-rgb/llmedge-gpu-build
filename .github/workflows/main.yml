name: Build Clean I2V GGUF Fix

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      SDKMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android Vulkan tools
        run: |
          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

          sudo apt-get update
          sudo apt-get install -y glslc libvulkan-dev ninja-build

      - name: Clone fresh official LLMEdge
        run: |
          git clone --recursive \
            https://github.com/Aatricks/llmedge.git \
            llmedge

          cd llmedge
          git submodule update --init --recursive

      - name: Apply Clean I2V patch
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/patch_clean_i2v.py"

      - name: Verify GGUF fix
        run: |
          grep -Rni \
            "Skip diagnostic GGUFReader JNI" \
            llmedge/llmedge-examples/app/src/main/java

          ! grep -R \
            "selectedVaeOverride\|taehvPath = null" \
            llmedge/llmedge-examples/app/src/main/java/com/example/llmedgeexample/demo/video/VideoGenerationActivity.kt

      - name: Build Vulkan library
        run: |
          cd llmedge

          rm -rf llmedge/.cxx

          ./gradlew :llmedge:assembleRelease \
            -Pandroid.injected.build.api=30 \
            -Pandroid.jniCmakeArgs="-DGGML_VULKAN=ON -DSD_VULKAN=ON" \
            --no-daemon

      - name: Build APK
        run: |
          cd llmedge/llmedge-examples

          echo "android.injected.testOnly=false" >> gradle.properties

          ./gradlew :app:assembleDebug \
            -Pandroid.injected.testOnly=false \
            -Pandroid.jniCmakeArgs="-DGGML_VULKAN=ON -DSD_VULKAN=ON" \
            --no-daemon

      - name: Prepare APK
        run: |
          APK="$GITHUB_WORKSPACE/llmedge/llmedge-examples/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/LLMEdge-Clean-I2V-GGUFFix.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LLMEdge-Clean-I2V-GGUFFix
          path: LLMEdge-Clean-I2V-GGUFFix.apk
          retention-days: 7
