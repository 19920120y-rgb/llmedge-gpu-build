name: Build LLMEdge GPU APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      SDKMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android and GPU build tools
        run: |
          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

          sudo apt-get update
          sudo apt-get install -y \
            glslc \
            libvulkan-dev \
            ninja-build

          glslc --version

      - name: Clone official LLMEdge
        run: |
          git clone --recursive https://github.com/Aatricks/llmedge.git llmedge
          cd llmedge
          git submodule update --init --recursive

      - name: Create separate GPU v6 app
        run: |
          cd llmedge/llmedge-examples

          sed -i \
            's/applicationId = "com.example.llmedgeexample"/applicationId = "com.example.llmedgegpuv6"/' \
            app/build.gradle.kts

          grep 'applicationId' app/build.gradle.kts

      - name: Build Vulkan GPU library
        run: |
          cd llmedge

          rm -rf llmedge/.cxx

          ./gradlew :llmedge:assembleRelease \
            -Pandroid.injected.build.api=30 \
            -Pandroid.jniCmakeArgs="-DGGML_VULKAN=ON -DSD_VULKAN=ON" \
            --no-daemon \
            --stacktrace

      - name: Build GPU APK
        run: |
          cd llmedge/llmedge-examples

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Prepare APK
        run: |
          APK="llmedge/llmedge-examples/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          cp "$APK" LLMEdge-GPU-v6.apk

          ls -lh LLMEdge-GPU-v6.apk
          sha256sum LLMEdge-GPU-v6.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LLMEdge-GPU-v6
          path: LLMEdge-GPU-v6.apk
          retention-days: 7
          if-no-files-found: error
