name: Build LLMEdge I2V v9 Offline APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      SDKMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android and Vulkan tools
        run: |
          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

          sudo apt-get update
          sudo apt-get install -y glslc libvulkan-dev ninja-build

      - name: Clone LLMEdge
        run: |
          git clone --recursive https://github.com/Aatricks/llmedge.git llmedge
          cd llmedge
          git submodule update --init --recursive

      - name: Patch v9 offline I2V
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("llmedge")
          ex = root / "llmedge-examples"

          # ---------- app identity ----------
          gradle = ex / "app/build.gradle.kts"
          s = gradle.read_text()
          s = s.replace(
              'applicationId = "com.example.llmedgeexample"',
              'applicationId = "com.example.llmedgei2vv9"'
          )
          gradle.write_text(s)

          manifest = ex / "app/src/main/AndroidManifest.xml"
          s = manifest.read_text()
          s = s.replace(
              'android:label="llmedge Example"',
              'android:label="LLMEdge I2V v9 Offline"'
          )
          manifest.write_text(s)

          strings = ex / "app/src/main/res/values/strings.xml"
          if strings.exists():
              s = strings.read_text()
              s = re.sub(
                  r'<string name="app_name">.*?</string>',
                  '<string name="app_name">LLMEdge I2V v9 Offline</string>',
                  s
              )
              strings.write_text(s)

          # ---------- Wan 2.2 mobile Q3 preset ----------
          form = ex / (
              "app/src/main/java/com/example/llmedgeexample/"
              "demo/video/VideoGenerationFormSupport.kt"
          )
          s = form.read_text()
          s = s.replace(
              'displayName = "Wan 2.2 TI2V 5B Q6_K"',
              'displayName = "Wan 2.2 TI2V 5B Q3_K_S (offline mobile)"'
          )
          s = s.replace(
              'filename = "Wan2.2-TI2V-5B-Q6_K.gguf"',
              'filename = "Wan2.2-TI2V-5B-Q3_K_S.gguf"'
          )
          form.write_text(s)

          # ---------- persistent local VAE import ----------
          media = ex / (
              "app/src/main/java/com/example/llmedgeexample/"
              "demo/video/VideoGenerationMediaSupport.kt"
          )
          s = media.read_text()

          start = s.index("    fun loadTaehvFile(")
          end = s.index("    suspend fun saveFramesAsGif(", start)

          new_loader = '''    fun loadTaehvFile(
              context: Context,
              uri: Uri,
          ): CachedVideoAsset {
              val directory =
                  File(context.filesDir, "imported-vae").apply { mkdirs() }

              val file = File(directory, "Wan2.2_VAE.safetensors")
              val partial = File(directory, "Wan2.2_VAE.safetensors.partial")

              partial.delete()

              val input =
                  context.contentResolver.openInputStream(uri)
                      ?: error("Unable to open selected VAE")

              input.use { source ->
                  partial.outputStream().use { output ->
                      source.copyTo(output, 1024 * 1024)
                  }
              }

              if (partial.length() <= 0L) {
                  partial.delete()
                  error("Selected VAE is empty")
              }

              if (file.exists()) file.delete()

              if (!partial.renameTo(file)) {
                  partial.copyTo(file, overwrite = true)
                  partial.delete()
              }

              return CachedVideoAsset(
                  file = file,
                  selectionPath = file.absolutePath,
              )
          }

          '''
          s = s[:start] + new_loader + s[end:]
          media.write_text(s)

          # ---------- Activity: TAEHV slot becomes local VAE ----------
          activity = ex / (
              "app/src/main/java/com/example/llmedgeexample/"
              "demo/video/VideoGenerationActivity.kt"
          )
          s = activity.read_text()

          if "import java.io.File" not in s:
              s = s.replace(
                  "import io.aatricks.llmedge.model.ModelSpec",
                  "import io.aatricks.llmedge.model.ModelSpec\nimport java.io.File"
              )

          s = s.replace(
              'VideoGenerationMediaSupport.createSafetensorPickerIntent("Select TAEHV (.safetensors)")',
              'VideoGenerationMediaSupport.createSafetensorPickerIntent("Select local Wan VAE (.safetensors)")'
          )

          s = s.replace(
              'FileLogger.i(TAG, "TAEHV loaded: $selectedTaehvPath")',
              'FileLogger.i(TAG, "Local VAE loaded: $selectedTaehvPath")'
          )

          s = s.replace(
              'views.taehvLabel.text = "No TAEHV selected"',
              'views.taehvLabel.text = "Use preset VAE"'
          )

          # Create local VAE ModelSpec before config.
          needle = '''        return VideoGenerationConfig(
          '''
          replacement = '''        val localVaeOverride =
              selectedTaehvPath?.let { path ->
                  ModelSpec.localFile(File(path))
              }

          return VideoGenerationConfig(
          '''
          if needle not in s:
              raise SystemExit("ERROR: VideoGenerationConfig insertion point missing")
          s = s.replace(needle, replacement, 1)

          s = s.replace(
              "            vae = modelPreset.vae,",
              "            vae = localVaeOverride ?: modelPreset.vae,"
          )

          # Do NOT pass the full Wan VAE as a TAEHV.
          s = s.replace(
              "            taehvPath = selectedTaehvPath,",
              "            taehvPath = null,"
          )

          # mobile defaults
          s = s.replace(
              "private const val DEFAULT_STEPS = 30",
              "private const val DEFAULT_STEPS = 12"
          )
          s = s.replace(
              "private const val DEFAULT_CFG = 5.0f",
              "private const val DEFAULT_CFG = 6.0f"
          )

          activity.write_text(s)

          # ---------- UI labels/defaults ----------
          layout = ex / "app/src/main/res/layout/activity_video_generation.xml"
          s = layout.read_text()

          s = s.replace(
              'android:text="TAEHV (Optional, overrides VAE)"',
              'android:text="Local VAE override (OFFLINE)"'
          )
          s = s.replace(
              'android:text="Select TAEHV"',
              'android:text="Select VAE"'
          )
          s = s.replace(
              'android:text="No TAEHV selected"',
              'android:text="Use preset VAE"'
          )

          # current XML defaults
          s = s.replace(
              'android:text="20"',
              'android:text="12"',
              1
          )
          s = s.replace(
              'android:text="7.0"',
              'android:text="6.0"',
              1
          )
          s = s.replace(
              'android:progress="80"',
              'android:progress="75"'
          )
          s = s.replace(
              'android:text="0.80"',
              'android:text="0.75"'
          )

          layout.write_text(s)

          # ---------- sequential load ----------
          controller = ex / (
              "app/src/main/java/com/example/llmedgeexample/"
              "demo/video/VideoGenerationController.kt"
          )
          s = controller.read_text()
          s = s.replace(
              "forceSequentialLoad = false,",
              "forceSequentialLoad = true,"
          )
          controller.write_text(s)

          print("===== V9 PATCHED =====")
          print("package=com.example.llmedgei2vv9")
          print("Wan 2.2 Q3 local model + local VAE override")
          PY

          echo "===== PATCH CHECK ====="

          grep -RniE \
            'I2V v9 Offline|llmedgei2vv9|Q3_K_S \(offline mobile\)|Local VAE override|localVaeOverride|imported-vae|taehvPath = null' \
            llmedge/llmedge-examples/app/src/main \
            | head -n 100

      - name: Build Vulkan library
        run: |
          cd llmedge
          rm -rf llmedge/.cxx

          ./gradlew :llmedge:assembleRelease \
            -Pandroid.injected.build.api=30 \
            -Pandroid.jniCmakeArgs="-DGGML_VULKAN=ON -DSD_VULKAN=ON" \
            --no-daemon \
            --stacktrace

      - name: Build v9 APK
        run: |
          cd llmedge/llmedge-examples

          echo "android.injected.testOnly=false" >> gradle.properties

          ./gradlew :app:assembleDebug \
            -Pandroid.injected.testOnly=false \
            -Pandroid.jniCmakeArgs="-DGGML_VULKAN=ON -DSD_VULKAN=ON" \
            --no-daemon \
            --stacktrace

      - name: Prepare APK
        run: |
          echo "===== APK CANDIDATES ====="
          find "$GITHUB_WORKSPACE" -type f -name 'app-debug.apk' -print

          APK="$GITHUB_WORKSPACE/llmedge/llmedge-examples/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            APK="$(find "$GITHUB_WORKSPACE" -type f -name 'app-debug.apk' -print -quit)"
          fi

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/LLMEdge-I2V-v9-Offline.apk"

          echo "===== APK INFO ====="
          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$GITHUB_WORKSPACE/LLMEdge-I2V-v9-Offline.apk" \
            | grep -E '^package:|^application-label:|^launchable-activity:|^native-code:'

          echo "===== TESTONLY ====="
          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump xmltree "$GITHUB_WORKSPACE/LLMEdge-I2V-v9-Offline.apk" AndroidManifest.xml \
            | grep -i 'android:testOnly' || true

          echo "===== SIGNATURE ====="
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose "$GITHUB_WORKSPACE/LLMEdge-I2V-v9-Offline.apk"

          ls -lh "$GITHUB_WORKSPACE/LLMEdge-I2V-v9-Offline.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LLMEdge-I2V-v9-Offline
          path: LLMEdge-I2V-v9-Offline.apk
          retention-days: 7
          if-no-files-found: error
