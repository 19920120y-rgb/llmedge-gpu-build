name: Build LLMEdge I2V v11 Offline APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      SDKMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android Vulkan tools
        run: |
          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

          sudo apt-get update
          sudo apt-get install -y glslc libvulkan-dev ninja-build

      - name: Clone official LLMEdge
        run: |
          git clone --recursive https://github.com/Aatricks/llmedge.git llmedge
          cd llmedge
          git submodule update --init --recursive

      - name: Patch v11
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/patch_v11.py"

          echo "===== PATCH CHECK ====="

          grep -RniE \
            'v11 Offline|llmedgei2vv11|Q3_K_S \(offline mobile\)|Local T5 encoder|Local VAE override|restoreOfflineAssets|selectedTextEncoderOverride|selectedVaeOverride|forceSequentialLoad = true' \
            llmedge/llmedge-examples/app/src/main \
            | head -n 160

      - name: Build Vulkan library
        run: |
          cd llmedge
          rm -rf llmedge/.cxx

          ./gradlew :llmedge:assembleRelease \
            -Pandroid.injected.build.api=30 \
            -Pandroid.jniCmakeArgs="-DGGML_VULKAN=ON -DSD_VULKAN=ON" \
            --no-daemon \
            --stacktrace

      - name: Build v11 APK
        run: |
          cd llmedge/llmedge-examples

          echo "android.injected.testOnly=false" >> gradle.properties

          ./gradlew :app:assembleDebug \
            -Pandroid.injected.testOnly=false \
            -Pandroid.jniCmakeArgs="-DGGML_VULKAN=ON -DSD_VULKAN=ON" \
            --no-daemon \
            --stacktrace

      - name: Prepare APK
        run: |
          APK="$GITHUB_WORKSPACE/llmedge/llmedge-examples/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found"
            find "$GITHUB_WORKSPACE" -type f -name '*.apk' -print
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/LLMEdge-I2V-v11-Offline.apk"

          echo "===== APK INFO ====="

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$GITHUB_WORKSPACE/LLMEdge-I2V-v11-Offline.apk" \
            | grep -E '^package:|^application-label:|^launchable-activity:|^native-code:'

          echo "===== TESTONLY ====="

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump xmltree "$GITHUB_WORKSPACE/LLMEdge-I2V-v11-Offline.apk" AndroidManifest.xml \
            | grep -i android:testOnly \
            || echo "testOnly ABSENT = OK"

          ls -lh "$GITHUB_WORKSPACE/LLMEdge-I2V-v11-Offline.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LLMEdge-I2V-v11-Offline
          path: LLMEdge-I2V-v11-Offline.apk
          retention-days: 7
          if-no-files-found: error
