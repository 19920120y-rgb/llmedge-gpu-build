name: Build Clean I2V GGUF Fix

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      SDKMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android Vulkan tools
        run: |
          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

          sudo apt-get update
          sudo apt-get install -y glslc libvulkan-dev ninja-build

      - name: Clone fresh official LLMEdge
        run: |
          set -euxo pipefail

          rm -rf llmedge llmedge-examples

          git clone \
            --depth 1 \
            --recurse-submodules \
            https://github.com/Aatricks/llmedge.git \
            llmedge

          git -C llmedge submodule sync --recursive
          git -C llmedge submodule update --init --recursive

          rm -rf llmedge/llmedge-examples

          git clone \
            --depth 1 \
            https://github.com/Aatricks/llmedge-examples.git \
            llmedge/llmedge-examples

          # 既存パッチスクリプト互換用
          ln -sfn \
            "$GITHUB_WORKSPACE/llmedge/llmedge-examples" \
            "$GITHUB_WORKSPACE/llmedge-examples"

          echo "===== LLMEDGE ====="
          git -C llmedge rev-parse HEAD

          echo "===== EXAMPLES ====="
          git -C llmedge/llmedge-examples rev-parse HEAD
      - name: Update stable-diffusion.cpp for Wan 5D GGUF
        run: |
          set -euxo pipefail

          SD="$GITHUB_WORKSPACE/llmedge/stable-diffusion.cpp"
          READER="$SD/src/model_io/gguf_reader_ext.h"

          test -d "$SD"

          echo "===== PINNED SDCPP ====="
          git -C "$SD" rev-parse HEAD
          git -C "$SD" remote -v

          # 現在のLLMEdgeが既にWan5D対応なら、その互換commitを優先
          if ! grep -Fq \
            'info.shape[GGML_MAX_DIMS - 1] *= info.shape[i]' \
            "$READER"
          then
            echo "===== PINNED SDCPP IS TOO OLD ====="

            git -C "$SD" fetch \
              --depth 1 \
              https://github.com/leejet/stable-diffusion.cpp.git \
              master

            git -C "$SD" checkout --detach FETCH_HEAD

            git -C "$SD" submodule sync --recursive
            git -C "$SD" submodule update \
              --init \
              --recursive \
              --depth 1
          fi

          echo "===== ACTIVE SDCPP ====="
          git -C "$SD" rev-parse HEAD

          # Wan GGUFの5D読込コードが無ければビルドを止める
          grep -F \
            'info.shape[GGML_MAX_DIMS - 1] *= info.shape[i]' \
            "$SD/src/model_io/gguf_reader_ext.h"

          grep -F \
            'info.shape.resize(GGML_MAX_DIMS)' \
            "$SD/src/model_io/gguf_reader_ext.h"

          # 実際のAPKにこのソースが入ったか後で検査するための印
          SRC="$SD/src/stable-diffusion.cpp"

          if [ ! -f "$SRC" ]; then
            SRC="$(find "$SD" -maxdepth 3 \
              -type f \
              -name 'stable-diffusion.cpp' \
              -print -quit)"
          fi

          test -n "$SRC"
          test -f "$SRC"

          if ! grep -Fq 'WAN5D_HARD_20260914' "$SRC"; then
            cat >> "$SRC" <<'CPP'

      extern "C"
      __attribute__((used, visibility("default")))
      const char* llmedge_wan5d_backend_marker() {
          return "WAN5D_HARD_20260914";
      }
      CPP
          fi

          echo "===== WAN5D SOURCE READY ====="
      - name: Apply Clean I2V patch
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/patch_clean_i2v.py"

      - name: Verify GGUF fix
        run: |
          set -euxo pipefail

          SD="$GITHUB_WORKSPACE/llmedge/stable-diffusion.cpp"

          echo "===== VERIFY 5D READER ====="

          grep -F \
            'info.shape[GGML_MAX_DIMS - 1] *= info.shape[i]' \
            "$SD/src/model_io/gguf_reader_ext.h"

          grep -F \
            'WAN5D_HARD_20260914' \
            "$SD/src/stable-diffusion.cpp"

          echo "===== VERIFY LOCAL LIBRARY SUBSTITUTION ====="

          grep -F \
            'includeBuild("..")' \
            "$GITHUB_WORKSPACE/llmedge/llmedge-examples/settings.gradle.kts"

          echo "===== VERIFIED ====="
      - name: Build Vulkan library
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/llmedge"

          rm -rf \
            llmedge/.cxx \
            llmedge/build \
            .gradle

          chmod +x ./gradlew

          ./gradlew \
            :llmedge:assembleRelease \
            --no-build-cache \
            --rerun-tasks \
            -Pandroid.injected.build.api=30 \
            -Pandroid.jniCmakeArgs="-DGGML_VULKAN=ON -DSD_VULKAN=ON"
      - name: Build APK
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/llmedge/llmedge-examples"

          rm -rf \
            app/build \
            .gradle

          chmod +x ./gradlew

          ./gradlew \
            :app:assembleDebug \
            --no-build-cache \
            --rerun-tasks \
            -Pandroid.jniCmakeArgs="-DGGML_VULKAN=ON -DSD_VULKAN=ON"
      - name: Prepare APK
        run: |
          set -euxo pipefail

          APK="$(find \
            "$GITHUB_WORKSPACE/llmedge/llmedge-examples/app/build/outputs/apk" \
            -type f \
            -name '*.apk' \
            -print -quit)"

          test -n "$APK"
          test -f "$APK"

          echo "APK=$APK"
          ls -lh "$APK"

          rm -rf "$GITHUB_WORKSPACE/apk-check"
          mkdir -p "$GITHUB_WORKSPACE/apk-check"

          unzip -q "$APK" \
            'lib/arm64-v8a/*.so' \
            -d "$GITHUB_WORKSPACE/apk-check"

          echo "===== VERIFY ACTUAL APK NATIVE BACKEND ====="

          FOUND=0

          while IFS= read -r so; do
            echo "CHECK: $so"

            if strings "$so" | grep -Fq 'WAN5D_HARD_20260914'; then
              echo "===== WAN5D MARKER FOUND IN APK ====="
              echo "$so"
              FOUND=1
            fi
          done < <(
            find "$GITHUB_WORKSPACE/apk-check" \
              -type f \
              -name '*.so'
          )

          if [ "$FOUND" != "1" ]; then
            echo "ERROR: APK STILL CONTAINS OLD NATIVE BACKEND"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"

          cp -f "$APK" \
            "$GITHUB_WORKSPACE/dist/LLMEdge-HARD-Wan5D-LowRAM.apk"

          echo "===== HARD WAN5D APK VERIFIED ====="
          ls -lh \
            "$GITHUB_WORKSPACE/dist/LLMEdge-HARD-Wan5D-LowRAM.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LLMEdge-HARD-Wan5D-LowRAM
          path: dist/LLMEdge-HARD-Wan5D-LowRAM.apk
          compression-level: 0
